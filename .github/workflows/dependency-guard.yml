# dependency-guard.yml — supply-chain guard for dependency changes.
#
# Implements docs/adr/0010-dependency-evaluation.md §7 (自动化守护) and
# docs/SECURITY_WHITEPAPER.md §5.3: whenever a manifest or lockfile changes,
# audit, license and duplicate checks run on the PR.
#
# This workflow owns the `pnpm audit` gate that docs/PROJECT_STATUS.md used to
# list as a gap (local-only). It is blocking for high/critical advisories and
# for denied licenses; the duplicate check is advisory.
#
# Quoting rule (SECURITY_WHITEPAPER §10): env values and variable references in
# `run:` are double-quoted.

name: Dependency Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit + license
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (block on high/critical)
        run: pnpm audit --audit-level=high

      - name: License check (deny GPL/AGPL/Proprietary)
        run: |
          pnpm licenses list --json > /tmp/licenses.json
          denied=$(jq -r 'keys[] | select(test("GPL|AGPL|Proprietary"; "i"))' /tmp/licenses.json)
          if [ -n "$denied" ]; then
            echo "::error::Denied licenses found:"
            echo "$denied"
            exit 1
          fi
          echo "No denied licenses."

      - name: Duplicate dependencies (advisory)
        run: pnpm dedupe --check || true

  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit
