# deploy.yml — multi-target deployment pipeline.
#
# Build once, deploy to multiple targets (docs/adr/0003-deployment-strategy.md,
# docs/DEPLOYMENT.md):
#   - codeberg  Codeberg Pages (SSH force-push of dist/client)
#   - github    GitHub Pages (withastro/action + actions/deploy-pages)
#   - ipfs      IPFS via Pinata (DISABLED via `if: false` pending cost/config)
#   - tgcloud   Telegram Bot / Mini App backend (independent pipeline)
#
# Static jobs (codeberg/ipfs) build with `pnpm build`, which runs the
# BuildPipeline hooks: Pagefind index, lychee link check, vnu HTML validation
# (see docs/SEARCH_TUNING.md, .agents/knowledge/deployment-procedures.md).
#
# The `e2e` job gates the static deploys (`needs: e2e`): Playwright Chromium
# runs against the built standalone server and must pass before publishing
# (docs/TESTING.md §4.5). tgcloud deploys independently.
#
# Quoting rule (SECURITY_WHITEPAPER §10): env values and variable references in
# `run:` are double-quoted.

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - "*.md"
      - "LICENSE.txt"
      - "src/post-edit/**"
      - "Cargo.toml"
  workflow_dispatch:

# Least privilege (SECURITY_WHITEPAPER §5.1): read for checkout, OIDC + Pages
# write for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install lychee /usr/local/bin/

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        env:
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        run: pnpm build

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  codeberg:
    name: codeberg
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install lychee /usr/local/bin/

      - name: Build
        env:
          SITE_URL: "https://lihua.codeberg.page"
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        run: |
          pnpm build
          rm -vr "./dist/server"

      - name: Create SSH directory
        run: mkdir ~/.ssh

      - name: Add Codeberg to known_hosts
        run: echo "codeberg.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVIC02vnjFyL+I4RHfvIGNtOgJMe769VTF1VR4EB3ZB" >> ~/.ssh/known_hosts

      - name: Write SSH key
        run: echo "${{ secrets.CODEBERG_PAGES }}" > ~/.ssh/id_ed25519

      - name: Set SSH key permissions
        run: chmod 400 ~/.ssh/id_ed25519

      - name: Push to Codeberg
        working-directory: ./dist/client
        run: |
          git clone --bare ssh://git@codeberg.org/lihua/pages .git
          git config unset core.bare
          git config set user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config set user.name "github-actions[bot]"
          git add .
          git commit -m "Update" || true
          git push -f origin main

  github:
    name: github
    needs: e2e
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install lychee /usr/local/bin/

      - uses: withastro/action@v6.1.1
        env:
          SITE_URL: "https://real-LiHua.github.io"
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        with:
          out-dir: "dist/client"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  ipfs:
    name: ipfs
    # Disabled per docs/adr/0003-deployment-strategy.md (Pinata config/cost
    # pending). Remove this guard to enable.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install lychee /usr/local/bin/

      - name: Build
        env:
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        run: |
          pnpm build
          rm -vr "./dist/server"

      - name: Setup Kubo CLI
        uses: ipfs/download-ipfs-distribution-action@v1

      - name: ipfs init
        run: ipfs init

      - name: Set pin name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '/' '-')
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHA_SHORT="${COMMIT_SHA:0:7}"
          PIN_NAME="${REPO_NAME}-${COMMIT_SHA_SHORT}"
          echo "pin_name=${PIN_NAME}" >> "$GITHUB_ENV"
          echo "Using pin name: ${PIN_NAME}"

      - name: Pin CID to Pinata
        run: |
          CID=$(ipfs add --cid-version 1 --chunker size-1048576 -Q -r .)
          ipfs pin remote service add pinata "https://api.pinata.cloud/psa" "${{ secrets.PINATA_JWT_TOKEN }}"
          ipfs pin remote add --service=pinata --background --name="${pin_name}" "$CID"
          echo "Pinned CID ${CID} to Pinata" >> "$GITHUB_STEP_SUMMARY"

  tgcloud:
    name: tgcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy bot, migrate schema, sync webhook
        env:
          # The tgcloud CLI authenticates non-interactively via TGCLOUD_TOKEN;
          # map the GitHub secret TG_API_TOKEN onto it.
          TGCLOUD_TOKEN: "${{ secrets.TG_API_TOKEN }}"
          # JWT_SECRET is a tgcloud Secret (runtime), not a GitHub secret — see
          # .env.example. Keep it in the platform secret store.
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        run: |
          pnpm run deploy
          pnpm exec tgcloud migrate --yes
          pnpm exec tgcloud webhook sync
