name: Site build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:font && pnpm run test:font-output
      - name: Resolve latest stable Maple Font release
        id: maple-font
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: "subframe7536",
              repo: "maple-font",
            });
            core.setOutput("tag", release.tag_name);
            core.info(`Using Maple Font release ${release.tag_name}`);
      - name: Cache Maple Font archive by release tag
        uses: actions/cache@v4
        with:
          path: .cache/maple-font
          key: ${{ runner.os }}-maple-font-${{ steps.maple-font.outputs.tag }}
      - name: Download and verify Maple Font
        run: pnpm run prepare:font
        env:
          MAPLE_FONT_RELEASE_TAG: ${{ steps.maple-font.outputs.tag }}
      - run: pnpm run build
      - run: pnpm run check:font-output
